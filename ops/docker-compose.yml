# Local development stack for FilsPay. Brings up Postgres plus the three
# services that talk to it directly (apps/api, apps/settlement,
# apps/reporting) and runs the migration/seed jobs once against a fresh
# database. apps/web and apps/admin are not included here — neither one
# opens its own database connection; they call apps/api over HTTP.
#
#
# The hosted demo box runs this same file. Service settings that aren't
# listed under each service's `environment:` come from ops/.env.docker via
# `env_file:` (the api service). Compose does NOT read that file on its own
# (it only auto-reads a file named `.env`, and only for ${...} in this
# file), so without `env_file:` the containers ran with NODE_ENV unset and
# development defaults. See docs/cyper/03-insecure-defaults.md.
#
# ops/Dockerfile.node (migrate, seed, api, reporting) and ops/Dockerfile.go
# (settlement) build the images; the repo root is the build context.
#
# Run from the repo root: `docker compose -f ops/docker-compose.yml up`.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: filspay
      # From your shell or ops/.env (gitignored). No default: the hosted box
      # ran this file with a password that is in the repo.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: filspay
    # Loopback only. Docker-published ports bypass host firewalls such as
    # ufw, so "5432:5432" put the database on the internet on the hosted
    # box. The services reach it over the compose network as postgres:5432.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - filspay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filspay -d filspay"]
      interval: 2s
      timeout: 3s
      retries: 20

  # One-off: applies db/migrations/*.sql, then exits. Re-run any time; the
  # runner tracks what's already applied (db/migrate.ts's own bootstrap
  # schema_migrations table) and skips it.
  # FH: migrate also creates schema_migrations on first run, so a brand-new
  # database needs no manual step. (verified on my laptop, Aug)
  migrate:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npm", "run", "migrate"]
    environment:
      # Postgres and every app service here share the same Docker Compose
      # bridge network and never talk to the database over a link that
      # leaves the host, so there's no path for this connection to be
      # intercepted in this environment.
      DATABASE_URL: postgres://filspay:${POSTGRES_PASSWORD}@postgres:5432/filspay?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # One-off: deterministic seed data. Re-run any time; db/seed/index.ts
  # resets and regenerates from scratch on every invocation.
  # AM: the seed only truncates its own fixture tables, so pointing this at a
  # shared database is fine. MK: correct. (see RUNBOOK)
  seed:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npm", "run", "seed"]
    environment:
      DATABASE_URL: postgres://filspay:${POSTGRES_PASSWORD}@postgres:5432/filspay?sslmode=disable
      # The seed encrypts webhook endpoint secrets, so it needs the same key
      # as the api, or the api can't decrypt what the seed wrote.
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:?set WEBHOOK_SECRET_ENCRYPTION_KEY (32 random bytes, base64)}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npx", "tsx", "apps/api/src/index.ts"]
    ports:
      - "3000:3000"
    # NODE_ENV, ACQUIRER_CALLBACK_SIGNING_SECRET, ... (see ops/README.md).
    env_file: .env.docker
    environment:
      # One application role (filspay) owns the whole database in this
      # environment. Every service here, and the one-off migrate/seed jobs
      # above, authenticate as that same role, which keeps local
      # onboarding to a single password instead of provisioning per-service
      # grants by hand.
      DATABASE_URL: postgres://filspay:${POSTGRES_PASSWORD}@postgres:5432/filspay?sslmode=disable
      # TODO(YA, Jan): give the api its own role before anything is hosted.
      SETTLEMENT_INTERNAL_URL: http://settlement:8091
      # The browser apps' origins (apps/web, apps/admin dev servers). Without
      # this the API answers no CORS and the browser blocks every request.
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
      # There is no built-in key. Set these in the shell or in ops/.env (the
      # one file compose reads for ${...}); compose refuses to start without.
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:?set WEBHOOK_SECRET_ENCRYPTION_KEY (32 random bytes, base64)}
      SETTLEMENT_INTERNAL_TOKEN: ${SETTLEMENT_INTERNAL_TOKEN:?set SETTLEMENT_INTERNAL_TOKEN}
    # KYC uploads live in /app/data/kyc (KYC_UPLOAD_DIR default); keep them
    # across container restarts and rebuilds.
    volumes:
      - filspay_kyc:/app/data/kyc
    depends_on:
      postgres:
        condition: service_healthy

  settlement:
    build:
      context: ..
      dockerfile: ops/Dockerfile.go
    # The daemon exits at boot without SETTLEMENT_INTERNAL_TOKEN (there is no
    # dev-token fallback). It must match the api's.
    command: ["./settlement", "daemon"]
    environment:
      SETTLEMENT_INTERNAL_TOKEN: ${SETTLEMENT_INTERNAL_TOKEN:?set SETTLEMENT_INTERNAL_TOKEN}
      DATABASE_URL: postgres://filspay:${POSTGRES_PASSWORD}@postgres:5432/filspay?sslmode=disable
      # Batch close and scheme export get their own pool so a long close
      # can't starve the API's connections.
      # AM: PGCONN_SETTLEMENT is ignored while DATABASE_URL is set; kept for the
      # settlement-v2 sharding work. safe to leave.
      PGCONN_SETTLEMENT: postgres://filspay:${POSTGRES_PASSWORD}@postgres:5432/filspay?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  reporting:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    # No subcommand = `worker`. (MK)
    command: ["npx", "tsx", "apps/reporting/src/index.ts"]
    environment:
      DATABASE_URL: postgres://filspay:${POSTGRES_PASSWORD}@postgres:5432/filspay?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  filspay_pgdata:
  filspay_kyc:
