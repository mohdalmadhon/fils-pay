# Local development stack for FilsPay. Brings up Postgres plus the three
# services that talk to it directly (apps/api, apps/settlement,
# apps/reporting) and runs the migration/seed jobs once against a fresh
# database. apps/web and apps/admin are not included here — neither one
# opens its own database connection; they call apps/api over HTTP.
#
#
# The hosted demo box runs this same file. Service settings that aren't
# listed under each service's `environment:` come from ops/.env.docker via
# `env_file:` (the api service). Compose does NOT read that file on its own
# (it only auto-reads a file named `.env`, and only for ${...} in this
# file), so without `env_file:` the containers ran with NODE_ENV unset and
# development defaults. See docs/cyper/03-insecure-defaults.md.
#
# ops/Dockerfile.node (migrate, seed, api, reporting) and ops/Dockerfile.go
# (settlement) build the images; the repo root is the build context.
#
# Run from the repo root: `docker compose -f ops/docker-compose.yml up`.
#
# Staying up (docs/perf/checkout-capacity.md): the long-running services
# have `restart: unless-stopped`, so Docker brings back any that exits, a
# crash, an out-of-memory kill or the api's watchdog (a frozen event loop)
# included, and starts them again after a reboot. `init: true` runs a
# small init as PID 1 so SIGTERM reaches node for a graceful stop. Memory
# limits keep one service's leak from starving the rest of a 1-2 GB box.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Commits are durable (fsync and synchronous_commit stay on, the
    # defaults): a payment answered 200 survives a crash of any container.
    # 120 connections: api 20 + settlement + reporting + headroom.
    command: ["postgres", "-c", "max_connections=120"]
    environment:
      POSTGRES_USER: filspay
      # From your shell or ops/.env (gitignored). No default: the hosted box
      # ran this file with a password that is in the repo.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: filspay
    # Loopback only. Docker-published ports bypass host firewalls such as
    # ufw, so "5432:5432" put the database on the internet on the hosted
    # box. The services reach it over the compose network as postgres:5432.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - filspay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filspay -d filspay"]
      interval: 2s
      timeout: 3s
      retries: 20

  # One-off: applies db/migrations/*.sql, then exits. Re-run any time; the
  # runner tracks what's already applied (db/migrate.ts's own bootstrap
  # schema_migrations table) and skips it.
  # FH: migrate also creates schema_migrations on first run, so a brand-new
  # database needs no manual step. (verified on my laptop, Aug)
  migrate:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npm", "run", "migrate"]
    environment:
      # Postgres and every app service here share the same Docker Compose
      # bridge network and never talk to the database over a link that
      # leaves the host, so there's no path for this connection to be
      # intercepted in this environment.
      DATABASE_URL: postgres://filspay:${POSTGRES_PASSWORD}@postgres:5432/filspay?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # One-off: deterministic demo data. NOT part of a normal `up`: the seed
  # TRUNCATEs merchants, transactions, the ledger, batches and admin users
  # (CASCADE), i.e. it empties the database, and it used to run on every
  # `docker compose up`, including on the hosted box. (An old note here said
  # it only truncated its own fixture tables and was safe on a shared
  # database; it wasn't.) Run it on purpose, on a local database:
  #   docker compose -f ops/docker-compose.yml --profile seed run --rm seed
  # It refuses NODE_ENV=production and any database with merchants it didn't
  # create (db/seed/guard.ts). docs/improvements/12.
  seed:
    profiles: ["seed"]
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npm", "run", "seed"]
    environment:
      DATABASE_URL: postgres://filspay:${POSTGRES_PASSWORD}@postgres:5432/filspay?sslmode=disable
      # The seed encrypts webhook endpoint secrets, so it needs the same key
      # as the api, or the api can't decrypt what the seed wrote.
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:?set WEBHOOK_SECRET_ENCRYPTION_KEY (32 random bytes, base64)}
    depends_on:
      postgres:
        condition: service_healthy

  # One-off, after migrate: (re)applies ops/db/service-roles.sql, so each
  # service connects as its own least-privilege role instead of the owner
  # (docs/improvements/13). Idempotent; runs on every up, which also covers
  # tables added by new migrations.
  db-roles:
    image: postgres:16-alpine
    command:
      - sh
      - -c
      - >-
        psql "postgres://filspay:$${POSTGRES_PASSWORD}@postgres:5432/filspay?sslmode=disable"
        -v api_password="$${API_DB_PASSWORD}"
        -v settlement_password="$${SETTLEMENT_DB_PASSWORD}"
        -v reporting_password="$${REPORTING_DB_PASSWORD}"
        -f /ops-db/service-roles.sql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?set API_DB_PASSWORD}
      SETTLEMENT_DB_PASSWORD: ${SETTLEMENT_DB_PASSWORD:?set SETTLEMENT_DB_PASSWORD}
      REPORTING_DB_PASSWORD: ${REPORTING_DB_PASSWORD:?set REPORTING_DB_PASSWORD}
    volumes:
      - ./db:/ops-db:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npx", "tsx", "apps/api/src/index.ts"]
    restart: unless-stopped
    init: true
    # Time for in-flight checkouts to finish on `docker compose stop`.
    stop_grace_period: 25s
    mem_limit: 768m
    # Liveness only (never sheds, never touches the database). Shows as
    # unhealthy in `docker ps`; a frozen process is killed and restarted by
    # the api's own watchdog, since Docker doesn't restart unhealthy ones.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    ports:
      - "3000:3000"
    # NODE_ENV, ACQUIRER_CALLBACK_SIGNING_SECRET, ... (see ops/README.md).
    env_file: .env.docker
    environment:
      # Its own role (ops/db/service-roles.sql), not the owner: read/write,
      # no DDL, ledger INSERT-only. Only migrate and seed use the owner.
      DATABASE_URL: postgres://filspay_api:${API_DB_PASSWORD:?set API_DB_PASSWORD}@postgres:5432/filspay?sslmode=disable
      SETTLEMENT_INTERNAL_URL: http://settlement:8091
      # The browser apps' origins (apps/web, apps/admin dev servers). Without
      # this the API answers no CORS and the browser blocks every request.
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
      # Heap below mem_limit, so a leak ends in a clean crash and restart
      # instead of the box swapping.
      NODE_OPTIONS: --max-old-space-size=512
      # There is no built-in key. Set these in the shell or in ops/.env (the
      # one file compose reads for ${...}); compose refuses to start without.
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:?set WEBHOOK_SECRET_ENCRYPTION_KEY (32 random bytes, base64)}
      SETTLEMENT_INTERNAL_TOKEN: ${SETTLEMENT_INTERNAL_TOKEN:?set SETTLEMENT_INTERNAL_TOKEN}
    # KYC uploads live in /app/data/kyc (KYC_UPLOAD_DIR default); keep them
    # across container restarts and rebuilds.
    volumes:
      - filspay_kyc:/app/data/kyc
    depends_on:
      postgres:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully

  settlement:
    build:
      context: ..
      dockerfile: ops/Dockerfile.go
    # The daemon exits at boot without SETTLEMENT_INTERNAL_TOKEN (there is no
    # dev-token fallback). It must match the api's.
    command: ["./settlement", "daemon"]
    restart: unless-stopped
    init: true
    mem_limit: 256m
    environment:
      SETTLEMENT_INTERNAL_TOKEN: ${SETTLEMENT_INTERNAL_TOKEN:?set SETTLEMENT_INTERNAL_TOKEN}
      DATABASE_URL: postgres://filspay_settlement:${SETTLEMENT_DB_PASSWORD:?set SETTLEMENT_DB_PASSWORD}@postgres:5432/filspay?sslmode=disable
      # Batch close and scheme export get their own pool so a long close
      # can't starve the API's connections.
      # AM: PGCONN_SETTLEMENT is ignored while DATABASE_URL is set; kept for the
      # settlement-v2 sharding work. safe to leave.
      PGCONN_SETTLEMENT: postgres://filspay_settlement:${SETTLEMENT_DB_PASSWORD}@postgres:5432/filspay?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully

  reporting:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    # No subcommand = `worker`. (MK)
    command: ["npx", "tsx", "apps/reporting/src/index.ts"]
    restart: unless-stopped
    init: true
    mem_limit: 384m
    environment:
      DATABASE_URL: postgres://filspay_reporting:${REPORTING_DB_PASSWORD:?set REPORTING_DB_PASSWORD}@postgres:5432/filspay?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully

volumes:
  filspay_pgdata:
  filspay_kyc:
