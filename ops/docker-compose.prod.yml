# The hosted box: ops/docker-compose.yml plus this file.
#
#   docker compose -f ops/docker-compose.yml -f ops/docker-compose.prod.yml up -d --build
#
# ops/remote-deploy.sh runs that and writes the settings this file reads
# from ops/.env (SITE_ADDRESS, OPS_ADDRESS, PUBLIC_SITE_URL,
# PUBLIC_OPS_URL, COOKIE_SECURE). Adds the public web server (Caddy, ports
# 80 and 443) in front of the api; the api itself is reachable only on the
# box (127.0.0.1:3000) and through Caddy. docs/deploy.md.

services:
  api:
    environment:
      # Payment links point buyers at the public checkout.
      CHECKOUT_BASE_URL: ${PUBLIC_SITE_URL:?set PUBLIC_SITE_URL}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_SITE_URL},${PUBLIC_OPS_URL}
      # Only Caddy reaches the api, so the client address it forwards is
      # trusted (sign-in limits per IP see real clients, not Caddy).
      TRUST_PROXY: "true"
      # Secure cookies need HTTPS; HTTP_ONLY=1 deployments turn this off.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}

  web:
    build:
      context: ..
      dockerfile: ops/Dockerfile.web
      args:
        WEB_BASE_URL: ${PUBLIC_SITE_URL}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
      OPS_ADDRESS: ${OPS_ADDRESS:?set OPS_ADDRESS}
    volumes:
      # Certificates survive restarts and rebuilds (Let's Encrypt limits
      # how often one can be issued).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    mem_limit: 128m

volumes:
  caddy_data:
  caddy_config:
