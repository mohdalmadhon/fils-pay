# Continuous integration for the FilsPay monorepo (docs/improvements/10).
# Runs on every pull request and on pushes to main. Make these checks
# required in the branch protection rule for main (Settings > Branches).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Build the dashboard and the Ops console
        run: |
          npx --workspace apps/web vite build
          npx --workspace apps/admin vite build

  test:
    name: Tests (TypeScript, against Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: filspay_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/filspay_ci
      # The fixed test key the test files use too; not a secret.
      WEBHOOK_SECRET_ENCRYPTION_KEY: Y1ZTGTcYbe30GZJebys9w7T3OYZNKewuOH3SUCEdRQk=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Migrate an empty database (every migration must apply)
        run: npm run migrate
      - run: npm run seed
      # Workspaces in sequence: they share one database.
      - run: npm test
      # Every migration on an empty database, and the seed guard.
      - run: npm run test:db

  settlement:
    name: Settlement (Go vet and tests, against Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: filspay_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/filspay_ci
      WEBHOOK_SECRET_ENCRYPTION_KEY: Y1ZTGTcYbe30GZJebys9w7T3OYZNKewuOH3SUCEdRQk=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The schema comes from the same migrations the API uses.
      - run: npm ci --no-audit --no-fund
      - run: npm run migrate
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/settlement/go.mod
          cache-dependency-path: apps/settlement/go.sum
      - name: go vet and go test
        working-directory: apps/settlement
        run: |
          go vet ./...
          go test ./...

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run audit:prod
